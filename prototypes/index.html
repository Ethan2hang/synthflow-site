<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asther Labs has moved</title>
  <link rel="canonical" href="https://astherlabs.ai/prototypes/index.html">
  <noscript><meta http-equiv="refresh" content="0;url=https://astherlabs.ai/prototypes/index.html"></noscript>
  <style>html{color-scheme:dark;background:#101024;color:#f8f5ef;font:17px/1.6 system-ui,sans-serif}body{max-width:42rem;margin:20vh auto;padding:24px}a{color:#c4b0f0}</style>
</head>
<body>
  <h1>Asther Labs has moved.</h1>
  <p><a id="destination" href="https://astherlabs.ai/prototypes/index.html">Continue to astherlabs.ai</a></p>
  <script>
    const destination = new URL('https://astherlabs.ai/');
    destination.pathname = window.location.pathname;
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    document.getElementById('destination').href = destination.href;
    window.location.replace(destination.href);
  </script>
</body>
</html>
